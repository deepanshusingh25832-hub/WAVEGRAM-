<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WAVEGRAM</title>

    <link
        rel="stylesheet"
        href="css/home.css"
    >

</head>


<body>


<!-- =========================================================
     SECTION 1
     HOME PAGE
========================================================= -->

<div
    id="homePage"
    class="home-page"
>


    <!-- =====================================================
         SECTION 2
         TOP 50PX BAR
    ====================================================== -->

    <div
        id="homeTopBar"
        class="home-top-bar"
    ></div>


    <!-- =====================================================
         SECTION 3
         SECOND 50PX BAR
    ====================================================== -->

    <div
        id="homeSecondBar"
        class="home-second-bar"
    >

        <!-- ================================================
             SECTION 4
             WAVEGRAM TITLE
        ================================================= -->

        <div
            id="homeTitle"
            class="home-title"
        >

            <svg
                class="wavegram-wordmark"
                viewBox="0 0 320 60"
                role="img"
                aria-label="WAVEGRAM"
            >

                <text
                    x="160"
                    y="43"
                    text-anchor="middle"
                >
                    WAVEGRAM
                </text>

            </svg>

        </div>

    </div>


    <!-- =====================================================
         SECTION 5
         HOME CONTENT
    ====================================================== -->

    <main
        id="homeContent"
        class="home-content"
    >


        <!-- =================================================
             SECTION 6
             USER STORY
        ================================================== -->

        <div
            id="userStoryBox"
            class="user-story-box"
        >

            <div
                class="user-story-dp-wrapper"
            >

                <img
                    id="userStoryDp"
                    class="user-story-dp"
                    src="images/unknown-dp.png"
                    alt="Profile"
                >


                <button
                    id="addStoryButton"
                    class="add-story-button"
                    type="button"
                    aria-label="Add Story"
                >

                    <span
                        class="add-story-plus"
                    ></span>

                </button>

            </div>

        </div>


    </main>


</div>


<!-- =========================================================
     SECTION 7
     HOME POST FEED
========================================================= -->

<section
    id="homePostFeed"
    class="home-post-feed"
>


    <!-- =====================================================
         SECTION 8
         POST CARD
    ====================================================== -->

    <article
        id="homePostCard"
        class="home-post-card"
    >


        <!-- =================================================
             SECTION 9
             POST HEADER
        ================================================== -->

        <div
            class="home-post-header"
        >

            <img
                id="homePostUserDp"
                class="home-post-user-dp"
                src="images/unknown-dp.png"
                alt="Profile"
            >


            <div
                class="home-post-user-info"
            >

                <div
                    id="homePostUsername"
                    class="home-post-username"
                >
                    name
                </div>

            </div>


            <button
                id="homePostMoreButton"
                class="home-post-more-button"
                type="button"
                aria-label="More"
            >

                <span aria-hidden="true">
                    ⋮
                </span>

            </button>

        </div>


        <!-- =================================================
             SECTION 10
             POST MEDIA
        ================================================== -->

        <div
            id="homePostMediaBox"
            class="home-post-media-box"
        >

            <img
                id="homePostMedia"
                class="home-post-media"
                src="images/wavegram-3d-post.png"
                alt="Post"
            >

        </div>


        <!-- =================================================
             SECTION 11
             POST ACTION BAR
        ================================================== -->

        <div
            id="homePostActionBar"
            class="home-post-action-bar"
        >


            <!-- =============================================
                 LIKE + COUNT
            ============================================== -->

            <button
                id="homePostLikeButton"
                class="home-post-action-button home-post-like-button"
                type="button"
                aria-label="Like"
            >

                <svg
                    class="home-post-action-svg like-svg"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path
                        d="M20.8 8.8
                           C20.8 5.9 18.7 4 16.1 4
                           C14.4 4 12.9 4.9 12 6.2
                           C11.1 4.9 9.6 4 7.9 4
                           C5.3 4 3.2 5.9 3.2 8.8
                           C3.2 13.4 7.7 16.2 12 20
                           C16.3 16.2 20.8 13.4 20.8 8.8 Z"
                    />

                </svg>


                <span
                    id="homePostLikeCount"
                    class="home-post-like-count"
                >
                    0
                </span>

            </button>


            <!-- =============================================
                 COMMENT
            ============================================== -->

            <button
                id="homePostCommentButton"
                class="home-post-action-button"
                type="button"
                aria-label="Comment"
            >

                <svg
                    class="home-post-action-svg"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path
                        d="M5 5
                           H19
                           C20.1 5 21 5.9 21 7
                           V15
                           C21 16.1 20.1 17 19 17
                           H10
                           L5 20
                           V17
                           C3.9 17 3 16.1 3 15
                           V7
                           C3 5.9 3.9 5 5 5 Z"
                    />

                    <path
                        d="M7.5 9 H16.5"
                    />

                    <path
                        d="M7.5 12.5 H14"
                    />

                </svg>

            </button>


            <!-- =============================================
                 SHARE
            ============================================== -->

            <button
                id="homePostShareButton"
                class="home-post-action-button"
                type="button"
                aria-label="Share"
            >

                <svg
                    class="home-post-action-svg"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path
                        d="M21 3
                           L10.5 13.5"
                    />

                    <path
                        d="M21 3
                           L14.3 21
                           L10.5 13.5
                           L3 10
                           Z"
                    />

                </svg>

            </button>


            <!-- =============================================
                 SAVE
            ============================================== -->

            <button
                id="homePostSaveButton"
                class="home-post-action-button home-post-save-button"
                type="button"
                aria-label="Save"
            >

                <svg
                    class="home-post-action-svg"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path
                        d="M6 4.5
                           C6 3.7 6.7 3 7.5 3
                           H16.5
                           C17.3 3 18 3.7 18 4.5
                           V21
                           L12 17.2
                           L6 21
                           Z"
                    />

                </svg>

            </button>


        </div>


        <!-- =================================================
             SECTION 12
             POST OPTIONS POPUP
        ================================================== -->

        <div
            id="homePostOptionsOverlay"
            class="home-post-options-overlay"
            aria-hidden="true"
        >


            <!-- =============================================
                 POPUP PANEL
            ============================================== -->

            <div
                id="homePostOptionsPopup"
                class="home-post-options-popup"
            >


                <!-- =========================================
                     HIDE LIKE
                ========================================== -->

                <button
                    id="homePostHideLikeOption"
                    class="home-post-option-button"
                    type="button"
                >
                    Hide Like
                </button>


                <!-- =========================================
                     HIDE COMMENT
                ========================================== -->

                <button
                    id="homePostHideCommentOption"
                    class="home-post-option-button"
                    type="button"
                >
                    Hide Comment
                </button>


                <!-- =========================================
                     HIDE SHARE
                ========================================== -->

                <button
                    id="homePostHideShareOption"
                    class="home-post-option-button"
                    type="button"
                >
                    Hide Share
                </button>


                <!-- =========================================
                     SAVE
                ========================================== -->

                <button
                    id="homePostSaveOption"
                    class="home-post-option-button"
                    type="button"
                >
                    Save
                </button>


                <!-- =========================================
                     EDIT POST
                ========================================== -->

                <button
                    id="homePostEditOption"
                    class="home-post-option-button"
                    type="button"
                >
                    Edit Post
                </button>


                <!-- =========================================
                     DELETE
                ========================================== -->

                <button
                    id="homePostDeleteOption"
                    class="home-post-option-button home-post-option-delete"
                    type="button"
                >
                    Delete
                </button>


                <!-- =========================================
                     CANCEL
                ========================================== -->

                <button
                    id="homePostOptionsCancel"
                    class="home-post-options-close"
                    type="button"
                >
                    Cancel
                </button>


            </div>

        </div>


        <!-- =================================================
             SECTION 13
             POST CAPTION
        ================================================== -->

        <div
            id="homePostCaption"
            class="home-post-caption"
        >

            <span
                class="home-post-caption-username"
            >
                name
            </span>

            <span
                class="home-post-caption-text"
            >
                Your post caption will appear here.
            </span>

        </div>


        <!-- =================================================
             SECTION 14
             POST TIME
        ================================================== -->

        <div
            id="homePostTime"
            class="home-post-time"
        >
            Just now
        </div>


    </article>


</section>


<!-- =========================================================
     SECTION 15
     HOME BOTTOM EMPTY BAR
========================================================= -->

<div
    id="homeBottomBar"
    class="home-bottom-bar"
></div>


<!-- =========================================================
     SECTION 16
     HOME BOTTOM NAVIGATION
========================================================= -->

<nav
    id="homeBottomNavigation"
    class="home-bottom-navigation"
    aria-label="Main navigation"
>


    <!-- =====================================================
         HOME
    ====================================================== -->

    <button
        id="homeNavHome"
        class="home-bottom-button active"
        type="button"
        aria-label="Home"
    >

        <svg
            class="home-nav-svg"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <path
                d="M3.5 10.7
                   L12 3.8
                   L20.5 10.7
                   V20
                   H14.7
                   V14.2
                   H9.3
                   V20
                   H3.5
                   Z"
            />

        </svg>

    </button>


    <!-- =====================================================
         SEARCH
    ====================================================== -->

    <button
        id="homeNavSearch"
        class="home-bottom-button"
        type="button"
        aria-label="Search"
    >

        <svg
            class="home-nav-svg"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <circle
                cx="10.8"
                cy="10.8"
                r="6.6"
            />

            <path
                d="M16 16 L21 21"
            />

        </svg>

    </button>


    <!-- =====================================================
         MESSAGE
    ====================================================== -->

    <button
        id="homeNavMessage"
        class="home-bottom-button"
        type="button"
        aria-label="Messages"
    >

        <svg
            class="home-nav-svg"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <path
                d="M4 5.5
                   C4 4.7 4.7 4 5.5 4
                   H18.5
                   C19.3 4 20 4.7 20 5.5
                   V15
                   C20 15.8 19.3 16.5 18.5 16.5
                   H10
                   L5 20
                   V16.5
                   H5.5
                   C4.7 16.5 4 15.8 4 15
                   Z"
            />

        </svg>

    </button>


    <!-- =====================================================
         REEL
    ====================================================== -->

    <button
        id="homeNavReel"
        class="home-bottom-button"
        type="button"
        aria-label="Reels"
    >

        <svg
            class="home-nav-svg"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <rect
                x="3.5"
                y="4.5"
                width="17"
                height="15"
                rx="4"
            />

            <path
                d="M3.8 9.5 H20.2"
            />

            <path
                d="M8 4.8
                   L11 9.3
                   M14 4.8
                   L17 9.3"
            />

        </svg>

    </button>


    <!-- =====================================================
         PROFILE
    ====================================================== -->

    <button
        id="homeNavProfile"
        class="home-bottom-button"
        type="button"
        aria-label="Profile"
    >

        <svg
            class="home-nav-svg"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <circle
                cx="12"
                cy="8"
                r="3.2"
            />

            <path
                d="M5 20
                   C5.6 15.8 8.2 13.7 12 13.7
                   C15.8 13.7 18.4 15.8 19 20"
            />

        </svg>

    </button>


</nav>


<!-- =========================================================
     SECTION 17
     HOME JAVASCRIPT
========================================================= -->

<script
    src="js/home.js"
></script>


</body>

</html>
