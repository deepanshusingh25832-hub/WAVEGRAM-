<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WAVEGRAM - Profile</title>

    <link
        rel="stylesheet"
        href="css/profile.css"
    >

</head>


<body>


<!-- =========================================================
     SECTION 1
     PROFILE PAGE
========================================================= -->

<div
    id="profilePage"
    class="profile-page"
>


    <!-- =====================================================
         SECTION 2
         TOP 50PX BAR
    ====================================================== -->

    <div
        id="profileTopBar"
        class="profile-top-bar"
    ></div>


    <!-- =====================================================
         SECTION 3
         SECOND 50PX BAR
    ====================================================== -->

    <div
        id="profileSecondBar"
        class="profile-second-bar"
    >

        <img
    id="profileAppIcon"
    class="profile-app-icon"
    src="images/wavegram-wg-logo.png"
    alt="WAVEGRAM"
>


        <span
            id="profileUsername"
            class="profile-username"
        >
            Username
        </span>
        
        <button
    id="profilePlusButton"
    class="profile-plus-button"
    type="button"
    aria-label="Add"
>

    <span class="profile-plus-icon"></span>

</button>
        
        <button
    id="profileSettingsButton"
    class="profile-settings-button"
    type="button"
    aria-label="Settings"
>

    <svg
        class="profile-settings-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
    >

        <path
            d="M9.7 3.8
               L10.3 2.5
               H13.7
               L14.3 3.8
               C15 4 15.7 4.3 16.3 4.7
               L17.7 4.1
               L20.1 6.5
               L19.4 7.9
               C19.8 8.5 20 9.2 20.2 9.9
               L21.5 10.5
               V13.9
               L20.2 14.5
               C20 15.2 19.8 15.9 19.4 16.5
               L20.1 17.9
               L17.7 20.3
               L16.3 19.6
               C15.7 20 15 20.3 14.3 20.5
               L13.7 21.8
               H10.3
               L9.7 20.5
               C9 20.3 8.3 20 7.7 19.6
               L6.3 20.3
               L3.9 17.9
               L4.6 16.5
               C4.2 15.9 4 15.2 3.8 14.5
               L2.5 13.9
               V10.5
               L3.8 9.9
               C4 9.2 4.2 8.5 4.6 7.9
               L3.9 6.5
               L6.3 4.1
               L7.7 4.7
               C8.3 4.3 9 4 9.7 3.8 Z"
        />

        <circle
            cx="12"
            cy="12.2"
            r="3.2"
        />

    </svg>

</button>

    </div>
    
    <!-- =====================================================
     SECTION 4
     GIF IMAGE BOX
====================================================== -->

<div
    id="profileGifBox"
    class="profile-gif-box"
>

    <div
        class="profile-gif-placeholder"
    >
        GIF
    </div>

</div>

<!-- =====================================================
     SECTION 5
     PROFILE DP BOX
====================================================== -->

<div
    id="profileDpBox"
    class="profile-dp-box"
>

    <img
        id="profileDp"
        class="profile-dp"
        src="images/unknown-dp.png"
        alt="Profile"
    >

</div>

<!-- =====================================================
     PROFILE STATS
====================================================== -->

<div
    id="profileStats"
    class="profile-stats"
>

    <div class="profile-stat">
        <span class="profile-stat-number">0</span>
        <span class="profile-stat-label">Post</span>
    </div>


    <div class="profile-stat">
        <span class="profile-stat-number">0</span>
        <span class="profile-stat-label">Followers</span>
    </div>


    <div class="profile-stat">
        <span class="profile-stat-number">0</span>
        <span class="profile-stat-label">Following</span>
    </div>

</div>

<!-- =====================================================
     PROFILE NAME AND BIO
====================================================== -->

<div
    id="profileInfo"
    class="profile-info"
>

    <div
        id="profileName"
        class="profile-name"
    >
        Name
    </div>


    <div
        id="profileBio"
        class="profile-bio"
    >
        Bio
    </div>

</div>

<!-- =====================================================
     SECTION 6
     PROFILE ACTION BUTTONS
====================================================== -->

<div
    id="profileActions"
    class="profile-actions"
>

    <button
        id="editProfileButton"
        class="profile-action-button"
        type="button"
    >
        Edit profile
    </button>


    <button
        id="shareProfileButton"
        class="profile-action-button"
        type="button"
    >
        Share profile
    </button>

</div>

<!-- =====================================================
     SECTION 7
     PROFILE CONTENT TABS
====================================================== -->

<div
    id="profileActionBar"
    class="profile-action-bar"
>

    <button
        id="profileBadgesTab"
        class="profile-tab-button active"
        type="button"
    >
        Badges
    </button>


    <button
        id="profilePostsTab"
        class="profile-tab-button"
        type="button"
    >
        Post
    </button>


    <button
        id="profileReelsTab"
        class="profile-tab-button"
        type="button"
    >
        Reel
    </button>

</div>

<!-- =====================================================
     SECTION 8
     PROFILE TAB CONTENT
====================================================== -->

<div
    id="badgesBox"
    class="profile-tab-content active"
>

    <div
        id="badgesPlaceholder"
        class="profile-box-placeholder"
    >
        BADGES
    </div>

</div>


<div
    id="postsBox"
    class="profile-tab-content"
>

    <div
        id="postsPlaceholder"
        class="profile-box-placeholder"
    >
        POST
    </div>

</div>


<div
    id="reelsBox"
    class="profile-tab-content"
>

    <div
        id="reelsPlaceholder"
        class="profile-box-placeholder"
    >
        REEL
    </div>

</div>

<!-- =====================================================
     SECTION 9
     BOTTOM EMPTY BAR
====================================================== -->

<div
    id="profileBottomBar"
    class="profile-bottom-bar"
></div>


<!-- =====================================================
     SECTION 10
     BOTTOM NAVIGATION
====================================================== -->

<nav
    id="profileBottomNavigation"
    class="profile-bottom-navigation"
    aria-label="Main navigation"
>

    <!-- HOME -->

    <button
        id="profileNavHome"
        class="profile-bottom-button"
        type="button"
        aria-label="Home"
    >

        <svg
            class="profile-nav-svg"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <path
                d="M3.5 10.7
                   L12 3.8
                   L20.5 10.7
                   V20
                   H14.7
                   V14.2
                   H9.3
                   V20
                   H3.5
                   Z"
            />

        </svg>

    </button>


    <!-- SEARCH -->

    <button
        id="profileNavSearch"
        class="profile-bottom-button"
        type="button"
        aria-label="Search"
    >

        <svg
            class="profile-nav-svg"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <circle
                cx="10.8"
                cy="10.8"
                r="6.6"
            />

            <path
                d="M16 16 L21 21"
            />

        </svg>

    </button>


    <!-- MESSAGE -->

    <button
        id="profileNavMessage"
        class="profile-bottom-button"
        type="button"
        aria-label="Messages"
    >

        <svg
            class="profile-nav-svg"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <path
                d="M4 5.5
                   C4 4.7 4.7 4 5.5 4
                   H18.5
                   C19.3 4 20 4.7 20 5.5
                   V15
                   C20 15.8 19.3 16.5 18.5 16.5
                   H10
                   L5 20
                   V16.5
                   H5.5
                   C4.7 16.5 4 15.8 4 15
                   Z"
            />

        </svg>

    </button>


    <!-- REEL -->

    <button
        id="profileNavReel"
        class="profile-bottom-button"
        type="button"
        aria-label="Reels"
    >

        <svg
            class="profile-nav-svg"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <rect
                x="3.5"
                y="4.5"
                width="17"
                height="15"
                rx="4"
            />

            <path
                d="M3.8 9.5 H20.2"
            />

            <path
                d="M8 4.8
                   L11 9.3
                   M14 4.8
                   L17 9.3"
            />

        </svg>

    </button>


    <!-- PROFILE -->

    <button
        id="profileNavProfile"
        class="profile-bottom-button active"
        type="button"
        aria-label="Profile"
    >

        <svg
            class="profile-nav-svg"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <circle
                cx="12"
                cy="8"
                r="3.2"
            />

            <path
                d="M5 20
                   C5.6 15.8 8.2 13.7 12 13.7
                   C15.8 13.7 18.4 15.8 19 20"
            />

        </svg>

    </button>

</nav>


    <!-- =====================================================
         SECTION 5
         PROFILE CONTENT
    ====================================================== -->

    <main
        id="profileContent"
        class="profile-content"
    >

    </main>


</div>


<!-- =========================================================
     SECTION 6
     PROFILE JAVASCRIPT
========================================================= -->

<script
    src="js/profile.js"
></script>


</body>

</html>
