<!DOCTYPE html>
<html lang="en">

<head>


    <!-- =====================================================
         SECTION 1
         BASIC DOCUMENT SETUP
    ====================================================== -->

    <meta charset="UTF-8">


    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >


    <meta
        name="theme-color"
        content="#050505"
    >


    <meta
        name="mobile-web-app-capable"
        content="yes"
    >


    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >


    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black"
    >


    <title>WAVEGRAM</title>


    <!-- =====================================================
         SECTION 2
         STYLESHEET
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >


</head>


<body>


    <!-- =====================================================
         SECTION 3
         WAVEGRAM SPLASH SCREEN
    ====================================================== -->

    <main
        id="splashScreen"
        class="splash-screen"
    >


        <!-- Decorative top gold curve -->

        <div
            class="gold-curve gold-curve-top"
            aria-hidden="true"
        ></div>


        <!-- Main logo area -->

        <section
            class="splash-content"
            aria-label="WAVEGRAM"
        >


            <!-- WAVEGRAM APP ICON -->

            <div
                id="appLogo"
                class="app-logo"
                aria-label="WAVEGRAM"
            >


                <!-- Premium WG mark -->

                <div
                    class="wg-logo"
                    aria-hidden="true"
                >

                    <span class="wg-w">
                        W
                    </span>

                    <span class="wg-g">
                        G
                    </span>

                </div>


            </div>


            <!-- App name -->

            <h1
                id="appName"
                class="app-name"
            >
                WAVEGRAM
            </h1>


            <!-- App tagline -->

            <p
                class="app-tagline"
            >
                Chat
                <span class="tagline-dot"></span>
                Connect
                <span class="tagline-dot"></span>
                Together
            </p>


        </section>


        <!-- Loading indicator -->

        <div
            class="loading-dots"
            aria-label="Loading"
        >

            <span></span>

            <span class="active"></span>

            <span></span>

        </div>


        <!-- Decorative bottom gold curve -->

        <div
            class="gold-curve gold-curve-bottom"
            aria-hidden="true"
        ></div>


    </main>


    <!-- =====================================================
         SECTION 4
         JAVASCRIPT
    ====================================================== -->

    <script
        src="js/app.js"
        defer
    ></script>


</body>

</html>
