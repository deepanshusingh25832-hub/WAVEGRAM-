<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WAVEGRAM - Search</title>

    <link
        rel="stylesheet"
        href="css/search.css"
    >

</head>


<body>


<!-- =========================================================
     SECTION 1
     SEARCH PAGE
========================================================= -->

<div
    id="searchPage"
    class="search-page"
>


    <!-- =====================================================
         SECTION 2
         TOP 50PX BAR
    ====================================================== -->

    <div
        id="searchTopBar"
        class="search-top-bar"
    ></div>


<!-- =====================================================
     SECTION 3
     SECOND 50PX BAR + SEARCH BOX
====================================================== -->

<div
    id="searchSecondBar"
    class="search-second-bar"
>

    <div
        id="searchBox"
        class="search-box"
    >

        <svg
            class="search-box-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <circle
                cx="10.8"
                cy="10.8"
                r="6.6"
            />

            <path
                d="M16 16 L21 21"
            />

        </svg>


        <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="Search"
            autocomplete="off"
            spellcheck="false"
        >

    </div>

</div>


    <!-- =====================================================
         SECTION 4
         SEARCH CONTENT
    ====================================================== -->

    <main
        id="searchContent"
        class="search-content"
    >

        <!-- Search content will be added here -->

    </main>


    <!-- =====================================================
         SECTION 5
         BOTTOM EMPTY 40PX BAR
    ====================================================== -->

    <div
        id="searchBottomBar"
        class="search-bottom-bar"
    ></div>


    <!-- =====================================================
         SECTION 6
         BOTTOM NAVIGATION
    ====================================================== -->

    <nav
        id="searchBottomNavigation"
        class="search-bottom-navigation"
        aria-label="Main navigation"
    >


        <!-- =================================================
             HOME
        ================================================== -->

        <button
            id="searchNavHome"
            class="search-bottom-button"
            type="button"
            aria-label="Home"
        >

            <svg
                class="search-nav-svg"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <path
                    d="M3.5 10.7
                       L12 3.8
                       L20.5 10.7
                       V20
                       H14.7
                       V14.2
                       H9.3
                       V20
                       H3.5
                       Z"
                />

            </svg>

        </button>


        <!-- =================================================
             SEARCH
        ================================================== -->

        <button
            id="searchNavSearch"
            class="search-bottom-button active"
            type="button"
            aria-label="Search"
        >

            <svg
                class="search-nav-svg"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <circle
                    cx="10.8"
                    cy="10.8"
                    r="6.6"
                />

                <path
                    d="M16 16 L21 21"
                />

            </svg>

        </button>


        <!-- =================================================
             MESSAGE
        ================================================== -->

        <button
            id="searchNavMessage"
            class="search-bottom-button"
            type="button"
            aria-label="Messages"
        >

            <svg
                class="search-nav-svg"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <path
                    d="M4 5.5
                       C4 4.7 4.7 4 5.5 4
                       H18.5
                       C19.3 4 20 4.7 20 5.5
                       V15
                       C20 15.8 19.3 16.5 18.5 16.5
                       H10
                       L5 20
                       V16.5
                       H5.5
                       C4.7 16.5 4 15.8 4 15
                       Z"
                />

            </svg>

        </button>


        <!-- =================================================
             REEL
        ================================================== -->

        <button
            id="searchNavReel"
            class="search-bottom-button"
            type="button"
            aria-label="Reels"
        >

            <svg
                class="search-nav-svg"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <rect
                    x="3.5"
                    y="4.5"
                    width="17"
                    height="15"
                    rx="4"
                />

                <path
                    d="M3.8 9.5 H20.2"
                />

                <path
                    d="M8 4.8
                       L11 9.3
                       M14 4.8
                       L17 9.3"
                />

            </svg>

        </button>


        <!-- =================================================
             PROFILE
        ================================================== -->

        <button
            id="searchNavProfile"
            class="search-bottom-button"
            type="button"
            aria-label="Profile"
        >

            <svg
                class="search-nav-svg"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <circle
                    cx="12"
                    cy="8"
                    r="3.2"
                />

                <path
                    d="M5 20
                       C5.6 15.8 8.2 13.7 12 13.7
                       C15.8 13.7 18.4 15.8 19 20"
                />

            </svg>

        </button>


    </nav>


</div>


<!-- =========================================================
     SECTION 7
     SEARCH JAVASCRIPT
========================================================= -->

<script
    src="js/search.js"
></script>


</body>

</html>
