<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Music</title>

    <link
        rel="stylesheet"
        href="css/music.css"
    >

</head>


<body>


    <!-- =====================================================
         SECTION 1
         MUSIC PAGE
    ====================================================== -->

    <div
        id="musicPage"
        class="music-page"
    >


        <!-- =================================================
             SECTION 2
             TOP 50PX BAR
        ================================================== -->

        <div
            id="musicTopBar"
            class="music-top-bar"
        ></div>


        <!-- =================================================
             SECTION 3
             SECOND 50PX BAR
        ================================================== -->

        <div
            id="musicHeader"
            class="music-header"
        >


            <!-- =============================================
                 SECTION 4
                 BACK BUTTON
            ============================================== -->

            <button
                id="musicBackButton"
                class="music-back-button"
                type="button"
                aria-label="Back"
            >

                <span
                    class="music-back-icon"
                ></span>

            </button>


            <!-- =============================================
                 SECTION 5
                 MUSIC TITLE
            ============================================== -->

            <div
                id="musicTitle"
                class="music-title"
            >
                Music
            </div>


        </div>


<!-- =================================================
     SECTION 6
     MUSIC CONTENT
================================================== -->

<main
    id="musicContent"
    class="music-content"
>


    <!-- =================================================
         SECTION 7
         MUSIC SEARCH
    ================================================== -->

    <div
        class="music-search-wrapper"
    >

        <input
            type="search"
            id="musicSearchInput"
            class="music-search-input"
            placeholder="Search music..."
            autocomplete="off"
            spellcheck="false"
        >

    </div>


    <!-- =================================================
         SECTION 8
         MUSIC LIST
    ================================================== -->

    <div
        id="musicList"
        class="music-list"
    >


        <!-- =============================================
             SECTION 9
             MUSIC CARD
        ============================================== -->

        <div
            class="music-card"
        >


            <!-- =========================================
                 SECTION 10
                 MUSIC THUMBNAIL
            ========================================== -->

            <div class="music-card-thumbnail">

    <img
        src="images/music-thumbnail.jpg"
        alt="Music"
        class="music-card-thumbnail-image"
    >

</div>


            <!-- =========================================
                 SECTION 11
                 MUSIC INFORMATION
            ========================================== -->

            <div
                class="music-card-info"
            >

                <div
                    class="music-card-name"
                >
                    Song Name
                </div>


                <div
                    class="music-card-artist"
                >
                    Artist Name
                </div>

            </div>


            <!-- =========================================
                 SECTION 12
                 PLAY BUTTON
            ========================================== -->

            <button
                type="button"
                class="music-card-play-button"
                aria-label="Play music"
            >

                <span
                    class="music-card-play-icon"
                ></span>

            </button>


        </div>


    </div>


</main>


    <script
        src="js/music.js"
    ></script>


</body>

</html>
